<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>the room</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #242220;
      --ink: #cdc8be;
      --faint: #7d7970;
      --warm: #343230;
      --surface: #2c2a28;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      line-height: 1.7;
    }

    button {
      appearance: none; -webkit-appearance: none;
      background: transparent; border: none;
      font-family: inherit; font-size: 0.85rem;
      color: var(--faint); cursor: pointer; padding: 0;
    }
    button:hover { color: var(--ink); }

    /* ── Top bar ── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 100;
      pointer-events: none;
    }

    #breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--faint);
      letter-spacing: 0.04em;
      pointer-events: all;
    }

    #breadcrumb .crumb {
      cursor: pointer;
      color: var(--faint);
    }
    #breadcrumb .crumb:hover { color: var(--ink); }
    #breadcrumb .crumb.current { color: var(--ink); cursor: default; }
    #breadcrumb .sep { color: var(--warm); user-select: none; }

    #topbar-actions {
      display: flex; gap: 1rem;
      font-size: 0.75rem; letter-spacing: 0.08em;
      pointer-events: all;
    }

    #topbar-actions button {
      color: var(--ink); font-size: 0.75rem; letter-spacing: 0.08em;
    }
    #topbar-actions button:hover { color: #fff; }

    /* ── Context menu ── */
    #ctx-menu {
      position: fixed;
      background: var(--surface);
      border: 1px solid var(--warm);
      padding: 0.4rem 0;
      z-index: 9999;
      display: none;
      min-width: 130px;
    }

    #ctx-menu.visible { display: block; }

    #ctx-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.35rem 1rem;
      font-size: 0.85rem;
      color: var(--faint);
      letter-spacing: 0.05em;
      border-radius: 0;
    }

    #ctx-menu button:hover {
      color: var(--ink);
      background: var(--warm);
    }

    /* ── Panels ── */
    .panel {
      position: absolute;
      background: var(--surface);
      border: 1px solid var(--warm);
      width: 320px;
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    .panel.raised { border-color: var(--faint); }

    .panel-handle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.8rem;
      cursor: grab;
      border-bottom: 1px solid var(--warm);
      user-select: none;
      flex-shrink: 0;
    }

    .panel-handle:active { cursor: grabbing; }

    .panel-handle .panel-title {
      font-size: 0.75rem;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--faint);
      flex: 1;
      min-width: 0;
    }

    .panel-handle button {
      font-size: 0.8rem;
      color: var(--faint);
      flex-shrink: 0;
    }

    .panel-body { padding: 0.8rem; flex: 1; overflow: hidden; }

    /* ── Notepad ── */
    .notepad-ta {
      width: 100%; min-height: 140px;
      background: transparent; border: none; padding: 0;
      font-family: inherit; font-size: inherit; line-height: inherit;
      color: var(--ink); resize: none; outline: none;
    }
    .notepad-ta::placeholder { color: var(--faint); }
    .saved-note { font-size: 0.7rem; color: var(--faint); margin-top: 0.4rem; height: 1em; }

    /* ── Checklist ── */
    .checklist-items { list-style: none; }

    .checklist-items li {
      display: flex; align-items: baseline; gap: 0.6rem; padding: 0.15rem 0;
    }

    .checklist-items input[type="checkbox"] {
      accent-color: var(--faint); flex-shrink: 0; margin-top: 0.15rem;
    }

    .checklist-items label { flex: 1; }

    .checklist-items li.done label { color: var(--faint); text-decoration: line-through; }

    .new-item-row {
      display: flex; gap: 0.6rem;
      margin-top: 0.6rem; padding-top: 0.6rem;
      border-top: 1px solid var(--warm);
    }

    .new-item-input {
      flex: 1; background: transparent; border: none;
      border-bottom: 1px solid var(--warm); padding: 0.15rem 0;
      font-family: inherit; font-size: inherit; color: var(--ink); outline: none;
    }
    .new-item-input::placeholder { color: var(--faint); }

    /* ── Resize handle ── */
    .resize-handle {
      position: absolute; bottom: 0; right: 0;
      width: 18px; height: 18px; cursor: nwse-resize; z-index: 2;
    }
    .resize-handle::after {
      content: '';
      position: absolute; bottom: 4px; right: 4px;
      width: 6px; height: 6px;
      border-right: 1px solid var(--faint);
      border-bottom: 1px solid var(--faint);
    }

    /* ── Image panels ── */
    .image-panel .panel-handle {
      border-bottom: none; padding: 0.4rem 0.6rem;
      opacity: 0; transition: opacity 0.15s;
      position: absolute; top: 0; left: 0; right: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
      z-index: 1;
    }
    .image-panel:hover .panel-handle { opacity: 1; }
    .image-panel .panel-body { padding: 0; display: flex; }
    .image-panel img { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* ── Folder panels ── */
    .folder-panel { width: 160px; }

    .folder-panel .panel-handle { border-bottom: none; }

    .folder-panel .folder-name {
      flex: 1; min-width: 0;
      font-size: 0.9rem; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-transform: none; letter-spacing: normal;
    }

    .folder-panel .folder-name-input {
      flex: 1; min-width: 0;
      background: transparent; border: none;
      border-bottom: 1px solid var(--faint);
      font-family: inherit; font-size: 0.9rem; color: var(--ink); outline: none; padding: 0;
    }

    .folder-panel .panel-body {
      padding: 0.2rem 0.8rem 0.6rem;
      font-size: 0.75rem; color: var(--faint);
      cursor: pointer;
    }
    .folder-panel .panel-body:hover { color: var(--ink); }

    /* ── Bookmarks ── */
    .bookmark-list {
      list-style: none; overflow-y: scroll; flex: 1; padding-right: 0.3rem;
      scrollbar-color: var(--faint) var(--warm);
      scrollbar-width: thin;
    }
    .bookmark-list::-webkit-scrollbar { width: 6px; }
    .bookmark-list::-webkit-scrollbar-track { background: var(--warm); }
    .bookmark-list::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 3px; }
    .bookmark-list::-webkit-scrollbar-thumb:hover { background: var(--ink); }

    .bookmark-list li {
      display: flex; align-items: baseline; gap: 0.5rem;
      padding: 0.2rem 0; border-bottom: 1px solid var(--warm);
    }

    .bookmark-list li:last-child { border-bottom: none; }

    .bookmark-link {
      flex: 1; min-width: 0;
      color: var(--ink); text-decoration: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-size: 0.9rem;
    }

    .bookmark-link:hover { text-decoration: underline; }

    .bookmark-url {
      font-size: 0.7rem; color: var(--faint);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 8rem; flex-shrink: 0;
    }

    .bookmark-title-input {
      flex: 1; background: transparent; border: none;
      border-bottom: 1px solid var(--faint);
      font-family: inherit; font-size: 0.9rem; color: var(--ink);
      outline: none; padding: 0;
    }

    /* ── Drop overlay ── */
    body.drag-over::after {
      content: 'drop image';
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: var(--faint); letter-spacing: 0.1em;
      border: 1px dashed var(--warm); margin: 2rem;
      pointer-events: none; z-index: 9998;
    }
  </style>
</head>
<body>

  <div id="topbar">
    <nav id="breadcrumb"></nav>
    <div id="topbar-actions"></div>
  </div>

  <div id="ctx-menu">
    <button data-create="notepad">notepad</button>
    <button data-create="checklist">checklist</button>
    <button data-create="bookmarks">bookmarks</button>
    <button data-create="folder">folder</button>
  </div>

  <script>
    // ─── Path / routing ───────────────────────────────────────────────────────

    function currentPath() {
      return decodeURIComponent(location.hash.slice(1)) || '';
    }

    function pathKey(key) {
      const p = currentPath();
      return p ? `room-${key}:${p}` : `room-${key}`;
    }

    function childPath(name) {
      const p = currentPath();
      return p ? `${p}/${name}` : name;
    }

    function navigate(path) {
      location.hash = encodeURIComponent(path);
      init();
    }

    // ─── Breadcrumb ───────────────────────────────────────────────────────────

    function renderBreadcrumb() {
      const nav = document.getElementById('breadcrumb');
      nav.innerHTML = '';
      const path = currentPath();
      const parts = path ? path.split('/') : [];

      const root = document.createElement('span');
      root.className = 'crumb' + (parts.length === 0 ? ' current' : '');
      root.textContent = 'the room';
      if (parts.length > 0) root.addEventListener('click', () => navigate(''));
      nav.appendChild(root);

      parts.forEach((part, i) => {
        const sep = document.createElement('span');
        sep.className = 'sep'; sep.textContent = ' › ';
        nav.appendChild(sep);

        const crumb = document.createElement('span');
        const isLast = i === parts.length - 1;
        crumb.className = 'crumb' + (isLast ? ' current' : '');
        crumb.textContent = part;
        if (!isLast) {
          const cp = parts.slice(0, i + 1).join('/');
          crumb.addEventListener('click', () => navigate(cp));
        }
        nav.appendChild(crumb);
      });
    }

    // ─── Undo stack ───────────────────────────────────────────────────────────

    const undoStack = [];

    function snapshotPanel(panel) {
      return {
        type: 'move',
        id: panel.id,
        left: panel.style.left, top: panel.style.top,
        width: panel.style.width, height: panel.style.height || '',
      };
    }

    function applySnapshot(snap) {
      if (snap.type === 'delete') {
        const store = storeFor(snap.kind);
        store.push(snap.data);
        saveStore(snap.kind);
        creators[snap.kind](snap.data);
        return;
      }
      const panel = document.getElementById(snap.id);
      if (!panel) return;
      panel.style.left  = snap.left;  panel.style.top   = snap.top;
      panel.style.width = snap.width; if (snap.height) panel.style.height = snap.height;
      syncStore(panel);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'z' && (e.ctrlKey || e.metaKey) && !e.shiftKey) {
        if (!undoStack.length) return;
        e.preventDefault();
        applySnapshot(undoStack.pop());
      }
    });

    // ─── Store helpers ────────────────────────────────────────────────────────

    const stores = { notepad: [], checklist: [], bookmarks: [], image: [], folder: [] };

    function storeFor(kind) { return stores[kind]; }

    function loadStore(kind) {
      try { stores[kind] = JSON.parse(localStorage.getItem(pathKey('store-' + kind))) || []; }
      catch { stores[kind] = []; }
    }

    function saveStore(kind) {
      localStorage.setItem(pathKey('store-' + kind), JSON.stringify(stores[kind]));
    }

    function syncStore(panel) {
      const kind = panel.dataset.kind;
      const entry = stores[kind].find(e => e.id === panel.id);
      if (!entry) return;
      entry.x = parseInt(panel.style.left);
      entry.y = parseInt(panel.style.top);
      entry.w = panel.offsetWidth;
      entry.h = panel.offsetHeight;
      saveStore(kind);
    }

    // ─── Shared drag / resize ─────────────────────────────────────────────────

    let dragging = null, dragOffsetX = 0, dragOffsetY = 0, dragSnapshot = null;
    let resizing = null, resizeSnapshot = null;

    function attachDragHandle(handle, panel) {
      handle.addEventListener('mousedown', e => {
        if (e.target.closest('button') ||
            e.target.classList.contains('folder-name') ||
            e.target.classList.contains('folder-name-input')) return;
        bringToFront(panel);
        dragSnapshot = snapshotPanel(panel);
        dragging = panel;
        dragOffsetX = e.clientX - panel.getBoundingClientRect().left;
        dragOffsetY = e.clientY - panel.getBoundingClientRect().top;
        e.preventDefault();
      });
    }

    function attachResizeHandle(handle, panel) {
      handle.addEventListener('mousedown', e => {
        resizeSnapshot = snapshotPanel(panel);
        resizing = panel;
        bringToFront(panel);
        e.preventDefault(); e.stopPropagation();
      });
    }

    document.addEventListener('mousemove', e => {
      if (dragging) {
        dragging.style.left = (e.clientX - dragOffsetX) + 'px';
        dragging.style.top  = (e.clientY - dragOffsetY) + 'px';
      }
      if (resizing) {
        const r = resizing.getBoundingClientRect();
        resizing.style.width  = Math.max(120, e.clientX - r.left) + 'px';
        resizing.style.height = Math.max(80,  e.clientY - r.top)  + 'px';
      }
    });

    document.addEventListener('mouseup', () => {
      if (dragging && dragSnapshot) { undoStack.push(dragSnapshot); syncStore(dragging); dragSnapshot = null; }
      if (resizing && resizeSnapshot) { undoStack.push(resizeSnapshot); syncStore(resizing); resizeSnapshot = null; }
      dragging = null; resizing = null;
    });

    // ─── z-index ──────────────────────────────────────────────────────────────

    let zTop = 10;
    function bringToFront(panel) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('raised'));
      panel.classList.add('raised');
      panel.style.zIndex = ++zTop;
    }

    // ─── Panel factory ────────────────────────────────────────────────────────

    function makePanel(data, extraClass) {
      const panel = document.createElement('div');
      panel.className = 'panel' + (extraClass ? ' ' + extraClass : '');
      panel.id = data.id;
      panel.dataset.kind = data.kind;
      panel.style.left  = data.x + 'px';
      panel.style.top   = data.y + 'px';
      panel.style.width = (data.w || 320) + 'px';
      if (data.h) panel.style.height = data.h + 'px';
      panel.addEventListener('mousedown', () => bringToFront(panel));
      return panel;
    }

    function makeHandle(labelText, onDelete) {
      const handle = document.createElement('div');
      handle.className = 'panel-handle';
      const title = document.createElement('span');
      title.className = 'panel-title';
      title.textContent = labelText;
      const del = document.createElement('button');
      del.textContent = '×';
      del.addEventListener('click', e => { e.stopPropagation(); onDelete(); });
      handle.append(title, del);
      return handle;
    }

    function makeResizeHandle(panel) {
      const rh = document.createElement('div');
      rh.className = 'resize-handle';
      attachResizeHandle(rh, panel);
      return rh;
    }

    function deletePanel(panel, kind) {
      const data = stores[kind].find(e => e.id === panel.id);
      if (data) undoStack.push({ type: 'delete', kind, data: { ...data } });
      stores[kind] = stores[kind].filter(e => e.id !== panel.id);
      saveStore(kind);
      panel.remove();
    }

    // ─── Notepad ──────────────────────────────────────────────────────────────

    function createNotepadPanel(data) {
      data.kind = 'notepad';
      const panel = makePanel(data, '');
      const handle = makeHandle('notepad', () => deletePanel(panel, 'notepad'));
      attachDragHandle(handle, panel);

      const body = document.createElement('div');
      body.className = 'panel-body';

      const ta = document.createElement('textarea');
      ta.className = 'notepad-ta';
      ta.placeholder = 'anything';
      ta.value = data.content || '';
      ta.rows = 8;

      const saved = document.createElement('div');
      saved.className = 'saved-note';

      let timer;
      ta.addEventListener('input', () => {
        clearTimeout(timer);
        saved.textContent = '';
        timer = setTimeout(() => {
          const entry = stores.notepad.find(e => e.id === data.id);
          if (entry) { entry.content = ta.value; saveStore('notepad'); }
          saved.textContent = 'saved';
          setTimeout(() => saved.textContent = '', 2000);
        }, 800);
      });

      body.append(ta, saved);
      panel.append(handle, body, makeResizeHandle(panel));
      document.body.appendChild(panel);
    }

    // ─── Checklist ────────────────────────────────────────────────────────────

    function createChecklistPanel(data) {
      data.kind = 'checklist';
      if (!data.items) data.items = [];
      const panel = makePanel(data, '');
      const handle = makeHandle('checklist', () => deletePanel(panel, 'checklist'));
      attachDragHandle(handle, panel);

      const body = document.createElement('div');
      body.className = 'panel-body';

      const ul = document.createElement('ul');
      ul.className = 'checklist-items';

      function saveItems() {
        const entry = stores.checklist.find(e => e.id === data.id);
        if (entry) { entry.items = data.items; saveStore('checklist'); }
      }

      function renderItems() {
        ul.innerHTML = '';
        data.items.forEach((item, i) => {
          const li = document.createElement('li');
          if (item.done) li.classList.add('done');

          const cb = document.createElement('input');
          cb.type = 'checkbox'; cb.checked = item.done; cb.id = `${data.id}-item-${i}`;
          cb.addEventListener('change', () => { item.done = cb.checked; saveItems(); renderItems(); });

          const label = document.createElement('label');
          label.htmlFor = cb.id; label.textContent = item.text;

          const del = document.createElement('button');
          del.textContent = '×';
          del.addEventListener('click', () => { data.items.splice(i, 1); saveItems(); renderItems(); });

          li.append(cb, label, del);
          ul.appendChild(li);
        });
      }

      const row = document.createElement('div');
      row.className = 'new-item-row';
      const input = document.createElement('input');
      input.className = 'new-item-input'; input.placeholder = 'add something';
      const addBtn = document.createElement('button');
      addBtn.textContent = 'add';

      function addItem() {
        const text = input.value.trim(); if (!text) return;
        data.items.push({ text, done: false }); saveItems(); renderItems();
        input.value = ''; input.focus();
      }

      addBtn.addEventListener('click', addItem);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

      row.append(input, addBtn);
      body.append(ul, row);
      renderItems();

      panel.append(handle, body, makeResizeHandle(panel));
      document.body.appendChild(panel);
    }

    // ─── Images ───────────────────────────────────────────────────────────────

    function createImagePanel(data) {
      data.kind = 'image';
      const panel = makePanel(data, 'image-panel');
      if (!data.h) panel.style.height = '240px';

      const handle = document.createElement('div');
      handle.className = 'panel-handle';
      const title = document.createElement('span');
      title.className = 'panel-title'; title.textContent = 'image';
      const del = document.createElement('button');
      del.textContent = '×';
      del.addEventListener('click', e => { e.stopPropagation(); deletePanel(panel, 'image'); });
      handle.append(title, del);
      attachDragHandle(handle, panel);

      const body = document.createElement('div');
      body.className = 'panel-body';
      const img = document.createElement('img');
      img.src = data.src; img.draggable = false;
      body.appendChild(img);

      panel.append(handle, body, makeResizeHandle(panel));
      document.body.appendChild(panel);
    }

    // ─── Folders ──────────────────────────────────────────────────────────────

    function createFolderPanel(data) {
      data.kind = 'folder';
      const panel = makePanel(data, 'folder-panel');

      const handle = document.createElement('div');
      handle.className = 'panel-handle';

      const icon = document.createElement('span');
      icon.textContent = '▸';
      icon.style.cssText = 'color:var(--faint);font-size:0.7rem;flex-shrink:0;cursor:pointer;';
      icon.title = 'open';
      icon.addEventListener('click', () => navigate(childPath(data.name)));

      const nameEl = document.createElement('span');
      nameEl.className = 'folder-name';
      nameEl.textContent = data.name;
      nameEl.title = 'double-click to rename';
      nameEl.addEventListener('dblclick', e => { e.stopPropagation(); startRename(panel, data, nameEl); });

      const del = document.createElement('button');
      del.textContent = '×';
      del.addEventListener('click', e => { e.stopPropagation(); deletePanel(panel, 'folder'); });

      handle.append(icon, nameEl, del);
      attachDragHandle(handle, panel);

      const body = document.createElement('div');
      body.className = 'panel-body';
      body.textContent = 'open';
      body.addEventListener('click', () => navigate(childPath(data.name)));

      panel.append(handle, body, makeResizeHandle(panel));
      document.body.appendChild(panel);
    }

    function startRename(panel, data, nameEl) {
      const input = document.createElement('input');
      input.className = 'folder-name-input';
      input.value = data.name;
      nameEl.replaceWith(input);
      input.focus(); input.select();

      function commit() {
        const newName = input.value.trim() || data.name;
        if (newName !== data.name) {
          renamePath(childPath(data.name), childPath(newName));
          data.name = newName;
          saveStore('folder');
        }
        nameEl.textContent = data.name;
        input.replaceWith(nameEl);
      }

      input.addEventListener('blur', commit);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        if (e.key === 'Escape') { input.value = data.name; input.blur(); }
      });
    }

    function renamePath(oldPath, newPath) {
      ['store-notepad', 'store-checklist', 'store-bookmarks', 'store-image', 'store-folder'].forEach(k => {
        const ok = `room-${k}:${oldPath}`, nk = `room-${k}:${newPath}`;
        const v = localStorage.getItem(ok);
        if (v !== null) { localStorage.setItem(nk, v); localStorage.removeItem(ok); }
      });
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i);
        if (key && key.includes(`:${oldPath}/`)) {
          const nk = key.replace(`:${oldPath}/`, `:${newPath}/`);
          localStorage.setItem(nk, localStorage.getItem(key));
          localStorage.removeItem(key);
        }
      }
    }

    // ─── Bookmarks ────────────────────────────────────────────────────────────

    function createBookmarksPanel(data) {
      data.kind = 'bookmarks';
      if (!data.items) data.items = [];
      const panel = makePanel(data, '');
      const handle = makeHandle('bookmarks', () => deletePanel(panel, 'bookmarks'));
      attachDragHandle(handle, panel);

      // Import button
      const importBtn = document.createElement('button');
      importBtn.textContent = 'import';
      importBtn.title = 'import browser bookmarks (.html)';
      importBtn.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = '.html,.htm';
        input.addEventListener('change', () => {
          const file = input.files[0]; if (!file) return;
          const reader = new FileReader();
          reader.onload = ev => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(ev.target.result, 'text/html');
            const items = [...doc.querySelectorAll('a[href]')]
              .filter(a => /^https?:\/\//i.test(a.getAttribute('href')))
              .map(a => ({ url: a.getAttribute('href'), title: a.textContent.trim() || a.getAttribute('href') }));
            if (!items.length) return;
            const newData = { id: 'bookmarks-' + Date.now(), kind: 'bookmarks', items, x: data.x + 20, y: data.y + 20, w: data.w, h: 340 };
            stores.bookmarks.push(newData);
            saveStore('bookmarks');
            createBookmarksPanel(newData);
            bringToFront(document.getElementById(newData.id));
          };
          reader.readAsText(file);
        });
        input.click();
      });

      // Export button
      const exportBtn = document.createElement('button');
      exportBtn.textContent = 'export';
      exportBtn.title = 'export as browser bookmarks (.html)';
      exportBtn.addEventListener('click', () => {
        const lines = [
          '<!DOCTYPE NETSCAPE-Bookmark-file-1>',
          '<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">',
          '<TITLE>Bookmarks</TITLE>',
          '<H1>Bookmarks</H1>',
          '<DL><p>',
          ...data.items.map(i => `  <DT><A HREF="${i.url}">${i.title}</A>`),
          '</DL><p>',
        ];
        const blob = new Blob([lines.join('\n')], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'bookmarks.html';
        a.click();
        URL.revokeObjectURL(a.href);
      });

      handle.append(importBtn, exportBtn);

      const body = document.createElement('div');
      body.className = 'panel-body';
      body.style.cssText = 'display:flex;flex-direction:column;overflow:hidden;';

      const ul = document.createElement('ul');
      ul.className = 'bookmark-list';

      function saveBookmarks() {
        const entry = stores.bookmarks.find(e => e.id === data.id);
        if (entry) { entry.items = data.items; entry.scrollTop = ul.scrollTop; saveStore('bookmarks'); }
      }

      function renderBookmarks() {
        ul.innerHTML = '';
        data.items.forEach((item, i) => {
          const li = document.createElement('li');

          const link = document.createElement('a');
          link.className = 'bookmark-link';
          link.href = item.url;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = item.title;
          link.title = item.url;

          // Double-click title to rename
          link.addEventListener('dblclick', e => {
            e.preventDefault();
            const input = document.createElement('input');
            input.className = 'bookmark-title-input';
            input.value = item.title;
            link.replaceWith(input);
            input.focus(); input.select();
            function commitRename() {
              item.title = input.value.trim() || item.title;
              saveBookmarks(); renderBookmarks();
            }
            input.addEventListener('blur', commitRename);
            input.addEventListener('keydown', e => {
              if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
              if (e.key === 'Escape') { input.value = item.title; input.blur(); }
            });
          });

          const host = document.createElement('span');
          host.className = 'bookmark-url';
          try { host.textContent = new URL(item.url).hostname; }
          catch { host.textContent = ''; }

          const del = document.createElement('button');
          del.textContent = '×';
          del.addEventListener('click', () => { data.items.splice(i, 1); saveBookmarks(); renderBookmarks(); });

          li.append(link, host, del);
          ul.appendChild(li);
        });
      }

      // Add row
      const row = document.createElement('div');
      row.style.cssText = 'margin-top:0.6rem;padding-top:0.6rem;border-top:1px solid var(--warm);display:flex;flex-direction:column;gap:0.4rem;';

      const urlInput = document.createElement('input');
      urlInput.className = 'new-item-input';
      urlInput.placeholder = 'url';
      urlInput.type = 'url';

      const titleInput = document.createElement('input');
      titleInput.className = 'new-item-input';
      titleInput.placeholder = 'title (optional)';

      // Pre-fill title from hostname when URL is entered
      urlInput.addEventListener('blur', () => {
        if (urlInput.value && !titleInput.value) {
          try {
            let url = urlInput.value.trim();
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            titleInput.value = new URL(url).hostname;
            titleInput.select();
          } catch {}
        }
      });

      const bottomRow = document.createElement('div');
      bottomRow.style.cssText = 'display:flex;gap:0.6rem;';

      const addBtn = document.createElement('button');
      addBtn.textContent = 'add';

      function addBookmark() {
        let url = urlInput.value.trim();
        if (!url) return;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        let title = titleInput.value.trim();
        if (!title) { try { title = new URL(url).hostname; } catch { title = url; } }
        data.items.push({ url, title });
        saveBookmarks(); renderBookmarks();
        urlInput.value = ''; titleInput.value = ''; urlInput.focus();
      }

      addBtn.addEventListener('click', addBookmark);
      titleInput.addEventListener('keydown', e => { if (e.key === 'Enter') addBookmark(); });
      urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); titleInput.focus(); } });

      bottomRow.append(titleInput, addBtn);
      row.append(urlInput, bottomRow);
      const scrollSaved = document.createElement('span');
      scrollSaved.style.cssText = 'position:absolute;bottom:1.4rem;right:1.4rem;font-size:0.7rem;color:var(--ink);transition:opacity 0.3s;opacity:0;pointer-events:none;z-index:3;';
      panel.append(scrollSaved);

      body.append(ul, row);
      renderBookmarks();
      requestAnimationFrame(() => { if (data.scrollTop) ul.scrollTop = data.scrollTop; });

      let scrollTimer;
      ul.addEventListener('scroll', () => {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          const entry = stores.bookmarks.find(e => e.id === data.id);
          if (entry) {
            entry.scrollTop = ul.scrollTop;
            saveStore('bookmarks');
            scrollSaved.textContent = 'position saved';
            scrollSaved.style.opacity = '1';
            setTimeout(() => scrollSaved.style.opacity = '0', 1500);
          }
        }, 400);
      });

      panel.append(handle, body, makeResizeHandle(panel));
      document.body.appendChild(panel);
    }

    // ─── Creator map ──────────────────────────────────────────────────────────

    const creators = {
      notepad:   createNotepadPanel,
      checklist: createChecklistPanel,
      bookmarks: createBookmarksPanel,
      image:     createImagePanel,
      folder:    createFolderPanel,
    };

    // ─── Context menu ─────────────────────────────────────────────────────────

    const ctxMenu = document.getElementById('ctx-menu');
    let ctxPos = { x: 0, y: 0 };

    document.addEventListener('contextmenu', e => {
      if (e.target.closest('.panel')) return; // let panels keep default
      e.preventDefault();
      ctxPos = { x: e.clientX, y: e.clientY };
      ctxMenu.style.left = e.clientX + 'px';
      ctxMenu.style.top  = e.clientY + 'px';
      ctxMenu.classList.add('visible');
    });

    document.addEventListener('click', e => {
      if (!ctxMenu.contains(e.target)) ctxMenu.classList.remove('visible');
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') ctxMenu.classList.remove('visible');
    });

    ctxMenu.querySelectorAll('button[data-create]').forEach(btn => {
      btn.addEventListener('click', () => {
        ctxMenu.classList.remove('visible');
        const kind = btn.dataset.create;
        const id = kind + '-' + Date.now();
        const data = { id, kind, x: ctxPos.x, y: ctxPos.y, w: kind === 'folder' ? 160 : 320 };
        if (kind === 'folder') data.name = 'new folder';
        stores[kind].push(data);
        saveStore(kind);
        creators[kind](data);
        if (kind === 'folder') {
          setTimeout(() => {
            const panel = document.getElementById(id);
            const nameEl = panel && panel.querySelector('.folder-name');
            if (nameEl) startRename(panel, data, nameEl);
          }, 50);
        }
      });
    });

    // ─── Image drop ───────────────────────────────────────────────────────────

    let dragCounter = 0;

    document.addEventListener('dragenter', e => {
      if ([...e.dataTransfer.types].includes('Files')) { dragCounter++; document.body.classList.add('drag-over'); }
    });
    document.addEventListener('dragleave', () => {
      if (--dragCounter <= 0) { dragCounter = 0; document.body.classList.remove('drag-over'); }
    });
    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => {
      e.preventDefault(); dragCounter = 0; document.body.classList.remove('drag-over');
      [...e.dataTransfer.files].filter(f => f.type.startsWith('image/')).forEach((file, i) => {
        const reader = new FileReader();
        reader.onload = ev => {
          const id = 'image-' + Date.now() + '-' + i;
          const data = { id, kind: 'image', src: ev.target.result, x: e.clientX + i * 20, y: e.clientY + i * 20, w: 300, h: 240 };
          stores.image.push(data);
          saveStore('image');
          createImagePanel(data);
        };
        reader.readAsDataURL(file);
      });
    });

    // ─── Save / Load room ─────────────────────────────────────────────────────

    const KINDS = ['notepad', 'checklist', 'bookmarks', 'image', 'folder'];

    function gatherRoom(basePath) {
      // Collect all localStorage data for basePath and its children
      const rooms = {};

      function storeKeyForPath(kind, path) {
        return path ? `room-store-${kind}:${path}` : `room-store-${kind}`;
      }

      function collectPath(path) {
        const rel = basePath ? path.slice(basePath.length).replace(/^\//, '') : path;
        const entry = {};
        KINDS.forEach(kind => {
          const val = localStorage.getItem(storeKeyForPath(kind, path));
          if (val) { try { entry[kind] = JSON.parse(val); } catch {} }
        });
        if (Object.keys(entry).length) rooms[rel] = entry;
      }

      // Collect basePath itself
      collectPath(basePath);

      // Collect all children
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key) continue;
        const prefix = basePath ? `room-store-` : `room-store-`;
        if (!key.startsWith('room-store-')) continue;
        // Extract path from key: room-store-{kind}:{path}
        const colonIdx = key.indexOf(':');
        if (colonIdx === -1) continue;
        const path = key.slice(colonIdx + 1);
        if (basePath ? (path === basePath || path.startsWith(basePath + '/')) : true) {
          collectPath(path);
        }
      }

      return rooms;
    }

    function saveRoom() {
      const basePath = currentPath();
      const rooms = gatherRoom(basePath);
      const payload = { version: 1, exported: new Date().toISOString().slice(0, 10), rooms };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const name = basePath ? basePath.split('/').pop() : 'room';
      a.download = `${name}.room.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function roomHasData(basePath) {
      return KINDS.some(kind => {
        const key = basePath ? `room-store-${kind}:${basePath}` : `room-store-${kind}`;
        const val = localStorage.getItem(key);
        try { return val && JSON.parse(val).length > 0; } catch { return false; }
      });
    }

    function clearRoomData(basePath) {
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i);
        if (!key || !key.startsWith('room-store-')) continue;
        const colonIdx = key.indexOf(':');
        const path = colonIdx === -1 ? '' : key.slice(colonIdx + 1);
        if (path === basePath || path.startsWith(basePath ? basePath + '/' : '')) {
          localStorage.removeItem(key);
        }
      }
    }

    function applyRoomPayload(payload, replace) {
      const basePath = currentPath();
      if (replace) clearRoomData(basePath);
      Object.entries(payload.rooms).forEach(([rel, entry]) => {
        const targetPath = rel ? (basePath ? `${basePath}/${rel}` : rel) : basePath;
        KINDS.forEach(kind => {
          if (!entry[kind]) return;
          const key = targetPath ? `room-store-${kind}:${targetPath}` : `room-store-${kind}`;
          if (replace) {
            localStorage.setItem(key, JSON.stringify(entry[kind]));
          } else {
            // Merge: append items, avoid duplicate ids
            let existing = [];
            try { existing = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}
            const existingIds = new Set(existing.map(e => e.id));
            const merged = [...existing, ...entry[kind].filter(e => !existingIds.has(e.id))];
            localStorage.setItem(key, JSON.stringify(merged));
          }
        });
      });
      init();
    }

    function promptMergeOrReplace(payload) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);';

      const box = document.createElement('div');
      box.style.cssText = 'background:var(--surface);border:1px solid var(--faint);padding:1.5rem 2rem;display:flex;flex-direction:column;gap:1rem;min-width:260px;';

      const msg = document.createElement('p');
      msg.style.cssText = 'font-size:0.85rem;color:var(--ink);line-height:1.5;';
      msg.textContent = 'This room already has content. Replace it or merge with it?';

      const btns = document.createElement('div');
      btns.style.cssText = 'display:flex;gap:1rem;justify-content:flex-end;';

      const cancelBtn = document.createElement('button');
      cancelBtn.textContent = 'cancel';
      cancelBtn.style.cssText = 'font-size:0.8rem;';
      cancelBtn.addEventListener('click', () => overlay.remove());

      const mergeBtn = document.createElement('button');
      mergeBtn.textContent = 'merge';
      mergeBtn.style.cssText = 'font-size:0.8rem;';
      mergeBtn.addEventListener('click', () => { overlay.remove(); applyRoomPayload(payload, false); });

      const replaceBtn = document.createElement('button');
      replaceBtn.textContent = 'replace';
      replaceBtn.style.cssText = 'font-size:0.8rem;color:var(--paper);background:var(--ink);padding:0.2rem 0.6rem;';
      replaceBtn.addEventListener('click', () => { overlay.remove(); applyRoomPayload(payload, true); });

      btns.append(cancelBtn, mergeBtn, replaceBtn);
      box.append(msg, btns);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
    }

    function loadRoom() {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.json';
      input.addEventListener('change', () => {
        const file = input.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          let payload;
          try { payload = JSON.parse(ev.target.result); } catch { alert('Invalid file.'); return; }
          if (!payload.rooms) { alert('Not a room file.'); return; }
          if (roomHasData(currentPath())) {
            promptMergeOrReplace(payload);
          } else {
            applyRoomPayload(payload, true);
          }
        };
        reader.readAsText(file);
      });
      input.click();
    }

    // Wire up topbar buttons
    (function() {
      const actions = document.getElementById('topbar-actions');
      const saveBtn = document.createElement('button');
      saveBtn.textContent = 'save room';
      saveBtn.addEventListener('click', saveRoom);
      const loadBtn = document.createElement('button');
      loadBtn.textContent = 'load room';
      loadBtn.addEventListener('click', loadRoom);
      actions.append(saveBtn, loadBtn);
    })();

    // ─── Init ─────────────────────────────────────────────────────────────────

    // ─── Migration: old key format → new ─────────────────────────────────────
    // Previous format used `room-{kind}s` (e.g. room-notepads).
    // New format uses `room-store-{kind}`.
    (function migrate() {
      const map = { notepads: 'store-notepad', checklists: 'store-checklist', images: 'store-image', folders: 'store-folder' };
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i);
        if (!key) continue;
        for (const [oldSuffix, newSuffix] of Object.entries(map)) {
          const oldPrefix = 'room-' + oldSuffix;
          if (key === oldPrefix || key.startsWith(oldPrefix + ':')) {
            const newKey = key.replace('room-' + oldSuffix, 'room-' + newSuffix);
            if (!localStorage.getItem(newKey)) {
              localStorage.setItem(newKey, localStorage.getItem(key));
            }
            localStorage.removeItem(key);
          }
        }
      }
    })();

    function init() {
      document.querySelectorAll('.panel').forEach(p => p.remove());
      undoStack.length = 0;
      renderBreadcrumb();
      ['notepad', 'checklist', 'bookmarks', 'image', 'folder'].forEach(kind => {
        loadStore(kind);
        stores[kind].forEach(data => creators[kind](data));
      });
    }

    window.addEventListener('hashchange', init);
    init();
  </script>

</body>
</html>
