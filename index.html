<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>the room</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --paper: #242220;
      --ink: #cdc8be;
      --faint: #7d7970;
      --warm: #343230;
      --surface: #2c2a28;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      line-height: 1.7;
    }

    #room-label {
      position: fixed;
      top: 1.5rem;
      left: 2rem;
      font-size: 0.85rem;
      font-weight: normal;
      color: var(--faint);
      letter-spacing: 0.05em;
      pointer-events: none;
      z-index: 0;
    }

    .panel {
      position: absolute;
      background: var(--surface);
      border: 1px solid var(--warm);
      width: 340px;
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    .panel.raised {
      z-index: 10;
      border-color: var(--faint);
    }

    .panel-handle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      cursor: grab;
      border-bottom: 1px solid var(--warm);
      user-select: none;
      flex-shrink: 0;
    }

    .panel-handle:active {
      cursor: grabbing;
    }

    .panel-handle h2 {
      font-size: 0.75rem;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--faint);
    }

    .panel-body {
      padding: 1rem;
      flex: 1;
      overflow: hidden;
    }

    /* Notepad */
    #notepad {
      width: 100%;
      min-height: 160px;
      background: transparent;
      border: none;
      padding: 0;
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      color: var(--ink);
      resize: none;
      outline: none;
    }

    #notepad::placeholder { color: var(--faint); }

    .saved-note {
      font-size: 0.7rem;
      color: var(--faint);
      margin-top: 0.5rem;
      height: 1em;
    }

    /* Checklist */
    #checklist-items { list-style: none; }

    #checklist-items li {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      padding: 0.2rem 0;
    }

    #checklist-items input[type="checkbox"] {
      accent-color: var(--faint);
      flex-shrink: 0;
      margin-top: 0.2rem;
    }

    #checklist-items label { flex: 1; }

    #checklist-items li.done label {
      color: var(--faint);
      text-decoration: line-through;
    }

    #new-item-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--warm);
    }

    #new-item {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--warm);
      padding: 0.2rem 0;
      font-family: inherit;
      font-size: inherit;
      color: var(--ink);
      outline: none;
    }

    #new-item::placeholder { color: var(--faint); }

    button {
      background: none;
      border: none;
      color: var(--faint);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0;
    }

    button:hover { color: var(--ink); }

    /* Resize handle */
    .resize-handle {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 18px;
      height: 18px;
      cursor: nwse-resize;
      z-index: 2;
    }

    .resize-handle::after {
      content: '';
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 6px;
      height: 6px;
      border-right: 1px solid var(--faint);
      border-bottom: 1px solid var(--faint);
    }

    /* Image panels */
    .image-panel .panel-handle {
      border-bottom: none;
      padding: 0.4rem 0.6rem;
      opacity: 0;
      transition: opacity 0.15s;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
      z-index: 1;
    }

    .image-panel:hover .panel-handle {
      opacity: 1;
    }

    .image-panel .panel-body {
      padding: 0;
      display: flex;
    }

    .image-panel img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Drop overlay */
    body.drag-over::after {
      content: 'drop image';
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: var(--faint);
      letter-spacing: 0.1em;
      border: 1px dashed var(--warm);
      margin: 2rem;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <span id="room-label">the room</span>

  <div class="panel" id="notes-section">
    <div class="panel-handle">
      <h2>notepad</h2>
    </div>
    <div class="panel-body">
      <textarea id="notepad" placeholder="anything" rows="8"></textarea>
      <div class="saved-note" id="save-status"></div>
    </div>
    <div class="resize-handle"></div>
  </div>

  <div class="panel" id="checklist-section">
    <div class="panel-handle">
      <h2>checklist</h2>
    </div>
    <div class="panel-body">
      <ul id="checklist-items"></ul>
      <div id="new-item-row">
        <input type="text" id="new-item" placeholder="add something">
        <button id="add-btn">add</button>
      </div>
    </div>
    <div class="resize-handle"></div>
  </div>

  <script>
    // ─── Layout (text panels) ────────────────────────────────────────────────

    const DEFAULT_POSITIONS = {
      'notes-section':     { x: 60,  y: 80, w: 340 },
      'checklist-section': { x: 440, y: 80, w: 320 },
    };

    function loadLayout() {
      try { return JSON.parse(localStorage.getItem('room-layout')) || {}; }
      catch { return {}; }
    }

    function saveLayout() {
      const layout = {};
      document.querySelectorAll('.panel:not(.image-panel)').forEach(panel => {
        layout[panel.id] = {
          x: parseInt(panel.style.left),
          y: parseInt(panel.style.top),
          w: panel.offsetWidth,
          h: panel.style.height ? parseInt(panel.style.height) : null,
        };
      });
      localStorage.setItem('room-layout', JSON.stringify(layout));
    }

    function applyLayout() {
      const saved = loadLayout();
      document.querySelectorAll('.panel:not(.image-panel)').forEach(panel => {
        const pos = saved[panel.id] || DEFAULT_POSITIONS[panel.id] || { x: 60, y: 80, w: 340 };
        panel.style.left  = pos.x + 'px';
        panel.style.top   = pos.y + 'px';
        panel.style.width = pos.w + 'px';
        if (pos.h) panel.style.height = pos.h + 'px';
      });
    }

    applyLayout();

    // ─── Images ─────────────────────────────────────────────────────────────

    function loadImages() {
      try { return JSON.parse(localStorage.getItem('room-images')) || []; }
      catch { return []; }
    }

    function saveImages() {
      localStorage.setItem('room-images', JSON.stringify(imageStore));
    }

    let imageStore = loadImages();

    function createImagePanel(data) {
      const panel = document.createElement('div');
      panel.className = 'panel image-panel';
      panel.id = data.id;
      panel.style.left   = data.x + 'px';
      panel.style.top    = data.y + 'px';
      panel.style.width  = data.w + 'px';
      panel.style.height = data.h + 'px';

      const handle = document.createElement('div');
      handle.className = 'panel-handle';

      const title = document.createElement('h2');
      title.textContent = 'image';

      const del = document.createElement('button');
      del.textContent = '×';
      del.addEventListener('click', e => {
        e.stopPropagation();
        undoStack.push({ type: 'delete-image', data: { ...data } });
        imageStore = imageStore.filter(img => img.id !== data.id);
        saveImages();
        panel.remove();
      });

      handle.append(title, del);

      const body = document.createElement('div');
      body.className = 'panel-body';

      const img = document.createElement('img');
      img.src = data.src;
      img.draggable = false;
      body.appendChild(img);

      const resizeHandle = document.createElement('div');
      resizeHandle.className = 'resize-handle';

      panel.append(handle, body, resizeHandle);
      document.body.appendChild(panel);

      attachDragHandle(handle, panel, () => {
        const entry = imageStore.find(i => i.id === data.id);
        if (entry) { entry.x = parseInt(panel.style.left); entry.y = parseInt(panel.style.top); saveImages(); }
      });

      attachResizeHandle(resizeHandle, panel, () => {
        const entry = imageStore.find(i => i.id === data.id);
        if (entry) { entry.w = panel.offsetWidth; entry.h = panel.offsetHeight; saveImages(); }
      });

      panel.addEventListener('mousedown', () => bringToFront(panel));
    }

    imageStore.forEach(createImagePanel);

    // ─── Undo stack ──────────────────────────────────────────────────────────

    const undoStack = [];

    function snapshotPanel(panel) {
      return {
        type: 'move',
        id: panel.id,
        left: panel.style.left,
        top: panel.style.top,
        width: panel.style.width,
        height: panel.style.height || '',
      };
    }

    function applySnapshot(snap) {
      if (snap.type === 'delete-image') {
        imageStore.push(snap.data);
        saveImages();
        createImagePanel(snap.data);
        return;
      }
      const panel = document.getElementById(snap.id);
      if (!panel) return;
      panel.style.left   = snap.left;
      panel.style.top    = snap.top;
      panel.style.width  = snap.width;
      if (snap.height) panel.style.height = snap.height;
      if (panel.classList.contains('image-panel')) {
        const entry = imageStore.find(i => i.id === snap.id);
        if (entry) { entry.x = parseInt(snap.left); entry.y = parseInt(snap.top); entry.w = parseInt(snap.width); if (snap.height) entry.h = parseInt(snap.height); saveImages(); }
      } else {
        saveLayout();
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'z' && (e.ctrlKey || e.metaKey) && !e.shiftKey) {
        if (undoStack.length === 0) return;
        e.preventDefault();
        applySnapshot(undoStack.pop());
      }
    });

    // ─── Shared drag/resize ──────────────────────────────────────────────────

    let dragging = null, dragOffsetX = 0, dragOffsetY = 0, dragSnapshot = null;
    let resizing = null, resizeSnapshot = null, onResizeDone = null, onDragDone = null;

    function attachDragHandle(handle, panel, onDone) {
      handle.addEventListener('mousedown', e => {
        if (e.target.tagName === 'BUTTON') return;
        bringToFront(panel);
        dragSnapshot = snapshotPanel(panel);
        dragging = panel;
        onDragDone = onDone || null;
        dragOffsetX = e.clientX - panel.getBoundingClientRect().left;
        dragOffsetY = e.clientY - panel.getBoundingClientRect().top;
        e.preventDefault();
      });
    }

    function attachResizeHandle(handle, panel, onDone) {
      handle.addEventListener('mousedown', e => {
        resizeSnapshot = snapshotPanel(panel);
        resizing = panel;
        onResizeDone = onDone || null;
        bringToFront(panel);
        e.preventDefault();
        e.stopPropagation();
      });
    }

    document.addEventListener('mousemove', e => {
      if (dragging) {
        dragging.style.left = (e.clientX - dragOffsetX) + 'px';
        dragging.style.top  = (e.clientY - dragOffsetY) + 'px';
      }
      if (resizing) {
        const rect = resizing.getBoundingClientRect();
        resizing.style.width  = Math.max(100, e.clientX - rect.left) + 'px';
        resizing.style.height = Math.max(60,  e.clientY - rect.top)  + 'px';
      }
    });

    document.addEventListener('mouseup', () => {
      if (dragging && dragSnapshot) {
        undoStack.push(dragSnapshot);
        if (onDragDone) onDragDone();
        else saveLayout();
        dragSnapshot = null; onDragDone = null;
      }
      if (resizing && resizeSnapshot) {
        undoStack.push(resizeSnapshot);
        if (onResizeDone) onResizeDone();
        else saveLayout();
        resizeSnapshot = null; onResizeDone = null;
      }
      dragging = null;
      resizing = null;
    });

    // ─── Attach drag/resize to static panels ────────────────────────────────

    document.querySelectorAll('.panel:not(.image-panel)').forEach(panel => {
      attachDragHandle(panel.querySelector('.panel-handle'), panel);
      attachResizeHandle(panel.querySelector('.resize-handle'), panel);
      panel.addEventListener('mousedown', () => bringToFront(panel));
    });

    // ─── z-index ─────────────────────────────────────────────────────────────

    let zTop = 10;
    function bringToFront(panel) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('raised'));
      panel.classList.add('raised');
      panel.style.zIndex = ++zTop;
    }

    // ─── Image drop ──────────────────────────────────────────────────────────

    let dragCounter = 0;

    document.addEventListener('dragenter', e => {
      if ([...e.dataTransfer.types].includes('Files')) {
        dragCounter++;
        document.body.classList.add('drag-over');
      }
    });

    document.addEventListener('dragleave', () => {
      dragCounter--;
      if (dragCounter <= 0) { dragCounter = 0; document.body.classList.remove('drag-over'); }
    });

    document.addEventListener('dragover', e => e.preventDefault());

    document.addEventListener('drop', e => {
      e.preventDefault();
      dragCounter = 0;
      document.body.classList.remove('drag-over');

      const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
      files.forEach((file, i) => {
        const reader = new FileReader();
        reader.onload = ev => {
          const id = 'img-' + Date.now() + '-' + i;
          const data = {
            id,
            src: ev.target.result,
            x: e.clientX + i * 20,
            y: e.clientY + i * 20,
            w: 300,
            h: 240,
          };
          imageStore.push(data);
          saveImages();
          createImagePanel(data);
        };
        reader.readAsDataURL(file);
      });
    });

    // ─── Notepad ─────────────────────────────────────────────────────────────

    const notepad   = document.getElementById('notepad');
    const saveStatus = document.getElementById('save-status');
    let saveTimer;

    notepad.value = localStorage.getItem('room-notepad') || '';

    notepad.addEventListener('input', () => {
      clearTimeout(saveTimer);
      saveStatus.textContent = '';
      saveTimer = setTimeout(() => {
        localStorage.setItem('room-notepad', notepad.value);
        saveStatus.textContent = 'saved';
        setTimeout(() => saveStatus.textContent = '', 2000);
      }, 800);
    });

    // ─── Checklist ───────────────────────────────────────────────────────────

    const itemsList    = document.getElementById('checklist-items');
    const newItemInput = document.getElementById('new-item');
    const addBtn       = document.getElementById('add-btn');

    let items = JSON.parse(localStorage.getItem('room-checklist') || '[]');

    function saveItems() { localStorage.setItem('room-checklist', JSON.stringify(items)); }

    function renderItems() {
      itemsList.innerHTML = '';
      items.forEach((item, i) => {
        const li = document.createElement('li');
        if (item.done) li.classList.add('done');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = item.done;
        cb.id = `item-${i}`;
        cb.addEventListener('change', () => { items[i].done = cb.checked; saveItems(); renderItems(); });

        const label = document.createElement('label');
        label.htmlFor = `item-${i}`;
        label.textContent = item.text;

        const del = document.createElement('button');
        del.textContent = '×';
        del.addEventListener('click', () => { items.splice(i, 1); saveItems(); renderItems(); });

        li.append(cb, label, del);
        itemsList.appendChild(li);
      });
    }

    function addItem() {
      const text = newItemInput.value.trim();
      if (!text) return;
      items.push({ text, done: false });
      saveItems();
      renderItems();
      newItemInput.value = '';
      newItemInput.focus();
    }

    addBtn.addEventListener('click', addItem);
    newItemInput.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

    renderItems();
  </script>

</body>
</html>
